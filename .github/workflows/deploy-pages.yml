name: Deploy MyPantry

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Generate browser configuration
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const url = process.env.SUPABASE_URL;
          const key = process.env.SUPABASE_PUBLISHABLE_KEY;
          if (!url || !key) {
            throw new Error('Add SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY as repository Actions secrets, then rerun this workflow.');
          }
          if (!key.startsWith('sb_publishable_')) {
            throw new Error('SUPABASE_PUBLISHABLE_KEY must be a browser-safe sb_publishable_ key.');
          }
          if (new URL(url).protocol !== 'https:') {
            throw new Error('SUPABASE_URL must use HTTPS.');
          }
          fs.mkdirSync('_site', { recursive: true });
          for (const file of ['index.html', 'app.js', 'auth.js', 'styles.css']) {
            fs.copyFileSync(file, '_site/' + file);
          }
          fs.writeFileSync('_site/config.js',
            'window.MYPANTRY_CONFIG = ' +
            JSON.stringify({ supabaseUrl: url, supabaseKey: key, demoMode: false }) +
            ';\n');
          NODE
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4

