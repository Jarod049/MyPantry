<!doctype html>
<html lang="en" data-palette="paprika">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>MyPantry</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400..800&display=swap">
<link rel="stylesheet" href="styles.css">
<style>[hidden]{display:none!important}</style>
</head>
<body>
<div class="stage">
  <aside class="demo-panel" id="demoPanel" aria-label="Demo tools" hidden>
    <div class="demo-panel-brand">
      <svg class="logo" viewBox="0 0 48 48" aria-hidden="true"><rect width="48" height="48" rx="14" fill="var(--basil)"/><path d="M14 20h20v14a4 4 0 0 1-4 4H18a4 4 0 0 1-4-4V20Z" fill="#fff"/><path d="M12 16h24v4H12z" fill="var(--butter-soft)"/><path d="M24 11c3 0 5 2 5 5h-10c0-3 2-5 5-5Z" fill="var(--theme-accent)"/><circle cx="24" cy="28" r="3.2" fill="var(--basil)"/></svg>
      <div>
        <div class="eyebrow">Authenticated demo account</div>
        <h1>Demo tools</h1>
      </div>
    </div>
    <p>These controls affect only the Demo account. Photo, receipt, and barcode scans use simulated clear/error outcomes while this account is signed in.</p>
    <div class="tools">
      <button type="button" data-tool="reset">Restart demo</button>
      <button type="button" data-tool="sample">Load sample pantry</button>
      <button type="button" data-tool="random">Create random pantry</button>
      <button type="button" data-tool="empty">Empty the pantry</button>
    </div>
    <p class="demo-panel-foot">Open any Scan flow to choose Clear/Blurry or Known/Unknown before capturing.</p>
  </aside>

  <div class="device-wrap">
    <div class="device">
      <div class="phone" id="phone">
        <header class="brandbar"><a class="brand-link" href="./" aria-label="MyPantry home"><svg viewBox="0 0 48 48" aria-hidden="true"><rect width="48" height="48" rx="14" fill="var(--basil)"/><path d="M14 20h20v14a4 4 0 0 1-4 4H18a4 4 0 0 1-4-4V20Z" fill="#fff"/><path d="M12 16h24v4H12z" fill="var(--butter-soft)"/><path d="M24 11c3 0 5 2 5 5h-10c0-3 2-5 5-5Z" fill="var(--theme-accent)"/></svg><span>MyPantry</span></a></header>
        <div id="app" class="view"></div>
      </div>
    </div>
  </div>
  <button type="button" class="demo-toggle-button" id="demoToggle" hidden>Demo tools</button>
</div>
<!-- Public configuration is generated by npm run build. Never use a secret key. -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@zxing/browser@0.2.1/umd/zxing-browser.min.js"></script>
<script src="config.js" onerror="console.warn('Missing configuration. Run npm start or configure the deployment build.')"></script>
<script src="auth.js"></script>
<script src="recipes.js"></script>
<script src="app.js"></script>
</body>
</html>
